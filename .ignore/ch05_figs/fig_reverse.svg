<g opacity="0"><text x="258.0" y="108.0" font-size="11.5" fill="#2e6da4" text-anchor="start">phase 2: reverse sweep &#8212;</text><text x="258.0" y="124.0" font-size="11.5" fill="#2e6da4" text-anchor="start">a&#773; += v&#773;&#183;b,  b&#773; += v&#773;&#183;a</text><text x="258.0" y="140.0" font-size="11.5" fill="#2e6da4" text-anchor="start">(&#8804; 2 mults per &#215; gate)</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.380;0.420;0.720;0.760;1.000" dur="7.0s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="258.0" y="176.0" font-size="11.5" fill="#2a7d2a" text-anchor="start">phase 3: every leaf holds its</text><text x="258.0" y="192.0" font-size="11.5" fill="#2a7d2a" text-anchor="start">derivative &#8212; the whole &#8711;P</text><text x="258.0" y="208.0" font-size="11.5" fill="#2a7d2a" text-anchor="start">for 3q = 9 multiplications</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.000;0.760;0.800;0.970;1.000" dur="7.0s" repeatCount="indefinite"/></g>
