<svg class="setupfig" viewBox="0 0 620 232" width="100%" role="img" aria-label="Anatomy of a 3SAT formula">
<text x="18" y="34" font-size="16" text-anchor="start" fill="#333" class="v">&#966; =</text>
<text x="62" y="34" font-size="17" text-anchor="start" fill="#333">(</text>
<text x="74" y="34" font-size="14" text-anchor="start" fill="#2e6da4" class="v">v&#8321;</text>
<text x="98" y="34" font-size="13" text-anchor="start" fill="#333">&#8744;</text>
<text x="120" y="34" font-size="14" text-anchor="start" fill="#2e6da4" class="v">v&#8322;</text>
<text x="144" y="34" font-size="13" text-anchor="start" fill="#333">&#8744;</text>
<text x="166" y="34" font-size="14" text-anchor="start" fill="#c0392b" class="v">&#172;v&#8323;</text>
<text x="200" y="34" font-size="17" text-anchor="start" fill="#333">)</text>
<rect x="58" y="14" width="154" height="30" rx="6" fill="none" stroke="#666" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="137" y="62" font-size="11" text-anchor="middle" fill="#666">clause C₁</text>
<text x="218" y="34" font-size="14" text-anchor="start" fill="#333">&#8743;</text>
<text x="242" y="34" font-size="17" text-anchor="start" fill="#333">(</text>
<text x="254" y="34" font-size="14" text-anchor="start" fill="#c0392b" class="v">&#172;v&#8321;</text>
<text x="288" y="34" font-size="13" text-anchor="start" fill="#333">&#8744;</text>
<text x="310" y="34" font-size="14" text-anchor="start" fill="#c0392b" class="v">&#172;v&#8322;</text>
<text x="344" y="34" font-size="13" text-anchor="start" fill="#333">&#8744;</text>
<text x="366" y="34" font-size="14" text-anchor="start" fill="#2e6da4" class="v">v&#8323;</text>
<text x="390" y="34" font-size="17" text-anchor="start" fill="#333">)</text>
<rect x="238" y="14" width="164" height="30" rx="6" fill="none" stroke="#666" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="322" y="62" font-size="11" text-anchor="middle" fill="#666">clause C₂</text>
<text x="18" y="96" font-size="12" text-anchor="start" fill="#333">a clause is satisfied when at least one of its three literals is true</text>
<rect x="14" y="112" width="340" height="92" rx="6" fill="#f0f7f0" stroke="#2a7d2a" stroke-width="1.2"/>
<text x="26" y="136" font-size="12" text-anchor="start" fill="#2a7d2a" font-weight="bold">assignment &#963; = (1, 0, 1)</text>
<text x="230" y="136" font-size="12" text-anchor="start" fill="#2a7d2a"></text>
<text x="26" y="160" font-size="12" text-anchor="start" fill="#333">C&#8321; = v&#8321;&#8744;v&#8322;&#8744;&#172;v&#8323;:</text>
<text x="230" y="160" font-size="12" text-anchor="start" fill="#2a7d2a">v&#8321; = 1 &#10003;</text>
<text x="26" y="184" font-size="12" text-anchor="start" fill="#333">C&#8322; = &#172;v&#8321;&#8744;&#172;v&#8322;&#8744;v&#8323;:</text>
<text x="230" y="184" font-size="12" text-anchor="start" fill="#2a7d2a">v&#8323; = 1 &#10003;</text>
<rect x="376" y="112" width="228" height="92" rx="6" fill="#f3f1ec" stroke="#666" stroke-width="1.2"/>
<text x="490" y="136" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">3SAT asks:</text>
<text x="490" y="158" font-size="11.5" text-anchor="middle" fill="#333">does ANY of the 2<tspan baseline-shift="super" font-size="75%">m</tspan> assignments</text>
<text x="490" y="176" font-size="11.5" text-anchor="middle" fill="#333">satisfy ALL &#8467; clauses?</text>
<text x="18" y="224" font-size="11.5" text-anchor="start" fill="#666">toy instance used throughout: m = 3, &#8467; = 2; &#963; = (1,0,1) satisfies &#966;</text>
</svg>