<text x="162" y="42" font-size="12" text-anchor="middle" fill="#333">Hankel matrix (&#956;&#7522;&#8330;&#8202;&#8467;(X)), h = 4</text>
<text x="162" y="284" font-size="10.5" text-anchor="middle" fill="#666">constant along anti-diagonals: entry = &#956;&#7522;&#8330;&#8202;&#8467;</text>
<text x="350" y="42" font-size="12" text-anchor="start" fill="#333">why it is invertible at a full fiber S(p) = {w&#8321;,&#8230;,w&#8344;}:</text>
<text x="350" y="68" font-size="12.5" text-anchor="start" fill="#333">&#956;&#7522;&#8330;&#8202;&#8467;(p) = &#8721;&#8348; w&#8348;<tspan baseline-shift="super" font-size="75%">i</tspan>&#8202;&#183;&#8202;w&#8348;<tspan baseline-shift="super" font-size="75%">&#8467;</tspan></text>
<text x="350" y="96" font-size="12.5" text-anchor="start" fill="#333">so  (&#956;&#7522;&#8330;&#8202;&#8467;(p)) = V&#8202;V&#7511;,   V&#7522;&#8202;&#8348; = w&#8348;<tspan baseline-shift="super" font-size="75%">i</tspan>  (Vandermonde)</text>
<text x="350" y="126" font-size="12.5" text-anchor="start" fill="#c0392b">det = det(V)&#178; = &#8719;&#8202;(w&#8348; &#8722; w&#8351;)&#178; &#8800; 0</text>
<text x="350" y="156" font-size="11.5" text-anchor="start" fill="#666">distinct elements &#8658; invertible;</text>
<text x="350" y="172" font-size="11.5" text-anchor="start" fill="#666">a smaller fiber gives rank &lt; h &#8658; det = 0</text>
<text x="350" y="202" font-size="11.5" text-anchor="start" fill="#333">one system, X left symbolic:</text>
<text x="350" y="224" font-size="12.5" text-anchor="start" fill="#2e6da4">&#8721;&#8202;&#8467; &#956;&#7522;&#8330;&#8202;&#8467;&#8202;c&#8467; = &#8722;&#956;&#7522;&#8330;&#8202;h   (0 &#8804; i &lt; h)</text>
<text x="350" y="246" font-size="11.5" text-anchor="start" fill="#666">solves ONCE over K(X); specializing at any</text>
<text x="350" y="262" font-size="11.5" text-anchor="start" fill="#666">full fiber recovers that fiber's polynomial</text>
