<svg class="setupfig" viewBox="0 0 640 344" width="100%" role="img" aria-label="Proof plan of the reconstruction lemma">
<defs><marker id="c7l10_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="20" y="20" width="280" height="52" rx="6" fill="#f3f1ec" stroke="#2e6da4" stroke-width="1.4"/>
<text x="160" y="40" font-size="11.5" text-anchor="middle" fill="#2e6da4" font-weight="bold">1. factorize at a full fiber</text>
<text x="160" y="58" font-size="10.5" text-anchor="middle" fill="#333">(&#956;(p)) = V&#8202;V&#7511; &#8658; &#916;&#8202;(p) &#8800; 0 &#8658; &#916; &#8800; 0</text>
<rect x="340" y="20" width="280" height="52" rx="6" fill="#f3f1ec" stroke="#2e6da4" stroke-width="1.4"/>
<text x="480" y="40" font-size="11.5" text-anchor="middle" fill="#2e6da4" font-weight="bold">2. count zeros of &#916;</text>
<text x="480" y="58" font-size="10.5" text-anchor="middle" fill="#333">deg &#916; &#8804; dh(h&#8722;1) &#8658; &#8805; |P| &#8722; dh(h&#8722;1) full fibers</text>
<rect x="20" y="108" width="280" height="52" rx="6" fill="#f3f1ec" stroke="#7d3c98" stroke-width="1.4"/>
<text x="160" y="128" font-size="11.5" text-anchor="middle" fill="#7d3c98" font-weight="bold">3. solve the Hankel system over K(X)</text>
<text x="160" y="146" font-size="10.5" text-anchor="middle" fill="#333">unique c&#8467; = n&#8467;/&#916;, deg n&#8467; &#8804; dh&#178; &#8658; G(Y)</text>
<rect x="340" y="108" width="280" height="52" rx="6" fill="#f3f1ec" stroke="#7d3c98" stroke-width="1.4"/>
<text x="480" y="128" font-size="11.5" text-anchor="middle" fill="#7d3c98" font-weight="bold">4. specialize at full fibers</text>
<text x="480" y="146" font-size="10.5" text-anchor="middle" fill="#333">ev&#8346;(G) = &#8719;(Y &#8722; w), w &#8712; S(p)</text>
<rect x="20" y="196" width="280" height="52" rx="6" fill="#f3f1ec" stroke="#c0392b" stroke-width="1.4"/>
<text x="160" y="216" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">5. Newton: power sums of roots</text>
<text x="160" y="234" font-size="10.5" text-anchor="middle" fill="#333">&#916;<tspan baseline-shift="super" font-size="75%">j</tspan>(&#956;&#8202;&#11388; &#8722; P&#8202;&#11388;) has deg &#8804; 2dK&#178;T, &gt; 2dK&#178;T zeros</text>
<rect x="340" y="196" width="280" height="52" rx="6" fill="#f3f1ec" stroke="#c0392b" stroke-width="1.4"/>
<text x="480" y="216" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">6. conclude the moment identities</text>
<text x="480" y="234" font-size="10.5" text-anchor="middle" fill="#333">&#956;&#11388;(X) = &#8721;&#8202;&#945;<tspan baseline-shift="super" font-size="75%">j</tspan> over the root set R</text>
<rect x="180" y="284" width="300" height="48" rx="6" fill="#f3f1ec" stroke="#2a7d2a" stroke-width="1.4"/>
<text x="330" y="304" font-size="11.5" text-anchor="middle" fill="#2a7d2a" font-weight="bold">7. separability for free</text>
<text x="330" y="322" font-size="10.5" text-anchor="middle" fill="#333">&#916; = &#8719;(&#945;&#8348; &#8722; &#945;&#8351;)&#178; &#8800; 0 &#8658; roots distinct</text>
