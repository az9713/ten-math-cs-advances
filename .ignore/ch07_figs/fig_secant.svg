<text x="190" y="16" font-size="11" text-anchor="middle" fill="#666">secants from the anchor (animated)</text>
<text x="500" y="16" font-size="11" text-anchor="middle" fill="#666">their slopes vs p</text>
<text x="18" y="304" font-size="11" text-anchor="start" fill="#333">real-line analogy of (C4): if the curve passes through the anchor, the secant slope (Q(X)&#8722;&#946;&#7522;)/(X&#8722;a&#7522;) is a POLYNOMIAL of degree deg&#8202;Q &#8722; 1;</text>
<text x="18" y="320" font-size="11" text-anchor="start" fill="#333">if not, it has a pole at a&#7522;. Over F&#8339; the same dichotomy is the factor theorem &#8212; and soundness will detect it with valuations (&#167;10, &#167;12).</text>
