<svg class="setupfig" viewBox="0 0 640 268" width="100%" role="img" aria-label="The field with 16 elements">
<text x="18" y="24" font-size="12" text-anchor="start" fill="#333">F&#8321;&#8326; = F&#8322;[x]/(x&#8308;+x+1): elements are 4-bit words; g = x generates the 15 nonzero elements</text>
<rect x="24" y="44" width="66" height="62" rx="5" fill="#f3f1ec" stroke="#666" stroke-width="1.1"/>
<text x="57" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0000</text>
<text x="57" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">0</text>
<text x="57" y="95" font-size="10" text-anchor="middle" fill="#666">0</text>
<rect x="100" y="44" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="133" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0001</text>
<text x="133" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">1 = g&#8304;</text>
<text x="133" y="95" font-size="10" text-anchor="middle" fill="#666">1</text>
<rect x="176" y="44" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="209" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0010</text>
<text x="209" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">1</tspan></text>
<text x="209" y="95" font-size="10" text-anchor="middle" fill="#666">x</text>
<rect x="252" y="44" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="285" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0011</text>
<text x="285" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">4</tspan></text>
<text x="285" y="95" font-size="10" text-anchor="middle" fill="#666">x + 1</text>
<rect x="328" y="44" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="361" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0100</text>
<text x="361" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">2</tspan></text>
<text x="361" y="95" font-size="10" text-anchor="middle" fill="#666">x&#178;</text>
<rect x="404" y="44" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="437" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0101</text>
<text x="437" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">8</tspan></text>
<text x="437" y="95" font-size="10" text-anchor="middle" fill="#666">x&#178;+1</text>
<rect x="480" y="44" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="513" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0110</text>
<text x="513" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">5</tspan></text>
<text x="513" y="95" font-size="10" text-anchor="middle" fill="#666">x&#178;+x</text>
<rect x="556" y="44" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="589" y="61" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">0111</text>
<text x="589" y="78" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">10</tspan></text>
<text x="589" y="95" font-size="10" text-anchor="middle" fill="#666">x&#178;+x + 1</text>
<rect x="24" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="57" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1000</text>
<text x="57" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">3</tspan></text>
<text x="57" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;</text>
<rect x="100" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="133" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1001</text>
<text x="133" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">14</tspan></text>
<text x="133" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;+1</text>
<rect x="176" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="209" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1010</text>
<text x="209" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">9</tspan></text>
<text x="209" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;+x</text>
<rect x="252" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="285" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1011</text>
<text x="285" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">7</tspan></text>
<text x="285" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;+x + 1</text>
<rect x="328" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="361" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1100</text>
<text x="361" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">6</tspan></text>
<text x="361" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;+x&#178;</text>
<rect x="404" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="437" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1101</text>
<text x="437" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">13</tspan></text>
<text x="437" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;+x&#178;+1</text>
<rect x="480" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="513" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1110</text>
<text x="513" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">11</tspan></text>
<text x="513" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;+x&#178;+x</text>
<rect x="556" y="120" width="66" height="62" rx="5" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.1"/>
<text x="589" y="137" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">1111</text>
<text x="589" y="154" font-size="11" text-anchor="middle" fill="#2e6da4">g<tspan baseline-shift="super" font-size="75%">12</tspan></text>
<text x="589" y="171" font-size="10" text-anchor="middle" fill="#666">x&#179;+x&#178;+x + 1</text>
<text x="18" y="216" font-size="12" text-anchor="start" fill="#333">addition = bitwise XOR:  0110 &#8853; 0011 = 0101   (every element is its own negative: char = 2)</text>
<text x="18" y="236" font-size="12" text-anchor="start" fill="#333">multiplication = polynomial product mod x&#8308;+x+1:  g&#179;&#183;g&#178; = g&#8309; = g&#178;+g = 0110</text>
<text x="18" y="256" font-size="11" text-anchor="start" fill="#666">the toy chapter field; the real construction uses q = 2<tspan baseline-shift="super" font-size="75%">1329</tspan> &#8776; N&#178;&#8304;&#8304; at N = 100</text>
</svg>