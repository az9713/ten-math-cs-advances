<svg class="setupfig" viewBox="0 0 620 210" width="100%" role="img" aria-label="Degree versus zero count">
<text x="18" y="30" font-size="12.5" text-anchor="start" fill="#333">the counting hammer used twice in Lemma 10 (and once in Lemma 13):</text>
<rect x="60" y="54" width="275" height="26" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.2"/>
<text x="197.5" y="70" font-size="11.5" text-anchor="middle" fill="#c0392b">max #zeros = deg &#8804; 2dK&#178;T</text>
<rect x="60" y="114" width="450" height="26" rx="6" fill="#f0f7f0" stroke="#2a7d2a" stroke-width="1.2"/>
<text x="285" y="130" font-size="11.5" text-anchor="middle" fill="#2a7d2a">#points where it provably vanishes &#8805; |P| &#8722; dK(K&#8722;1) &gt; 2dK&#178;T</text>
<line x1="335" y1="84" x2="335" y2="112" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="310" y="172" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">a nonzero polynomial cannot vanish more often than its degree &#8658; the polynomial is identically zero</text>
<text x="310" y="194" font-size="11" text-anchor="middle" fill="#666">this is where the moment identities become TRUE IDENTITIES in K(X), not just facts about sampled points</text>
</svg>