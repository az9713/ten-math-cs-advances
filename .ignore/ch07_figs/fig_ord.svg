<text x="452" y="40" font-size="11.5" text-anchor="start" fill="#333">ord&#8202;&#8467;&#8342;(g) = how many</text>
<text x="452" y="56" font-size="11.5" text-anchor="start" fill="#333">factors of &#8467;&#8342; = X &#8722; a</text>
<text x="452" y="72" font-size="11.5" text-anchor="start" fill="#333">divide g</text>
<text x="452" y="100" font-size="11.5" text-anchor="start" fill="#2a7d2a">&gt; 0: zero at a</text>
<text x="452" y="118" font-size="11.5" text-anchor="start" fill="#b8860b">= 0: finite, nonzero</text>
<text x="452" y="136" font-size="11.5" text-anchor="start" fill="#7d3c98">&lt; 0: pole at a</text>
<text x="452" y="168" font-size="11.5" text-anchor="start" fill="#333">v(gh) = v(g) + v(h)</text>
<text x="452" y="186" font-size="11.5" text-anchor="start" fill="#333">v(g+h) &#8805; min(v(g), v(h))</text>
<text x="452" y="214" font-size="10.5" text-anchor="start" fill="#666">the real plots are an analogy;</text>
<text x="452" y="230" font-size="10.5" text-anchor="start" fill="#666">the definition is pure algebra</text>
<text x="452" y="246" font-size="10.5" text-anchor="start" fill="#666">and works over any field</text>
