<svg class="setupfig" viewBox="0 0 520 176" width="100%" role="img" aria-label="why no block-size factor survives">
<text x="260" y="26" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">the size-bias cancellation in Lemma 4.6</text>
<rect x="30" y="44" width="210" height="58" rx="6" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.4"/>
<text x="135" y="66" font-size="11.5" text-anchor="middle" fill="#333">reverse partition picks the</text>
<text x="135" y="82" font-size="11.5" text-anchor="middle" fill="#333">live block: weight 2N/m</text>
<rect x="280" y="44" width="210" height="58" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.4"/>
<text x="385" y="66" font-size="11.5" text-anchor="middle" fill="#333">uniform cut inside the block:</text>
<text x="385" y="82" font-size="11.5" text-anchor="middle" fill="#333">each step weight 1/N</text>
<text x="260" y="130" font-size="13" text-anchor="middle" fill="#2a7d2a" font-weight="bold">(2N/m) × (1/N) = 2/m  —  the block size N cancels exactly</text>
<text x="260" y="158" font-size="12" text-anchor="middle" fill="#333">summing the fair-partition weights 2⁻ᵐ over all partitions gives ≤ 1, so I<tspan baseline-shift="sub" font-size="70%">A</tspan>, I<tspan baseline-shift="sub" font-size="70%">B</tspan> ≤ 2p(τ + s)/m</text>
</svg>