<svg class="setupfig" viewBox="0 0 540 266" width="100%" role="img" aria-label="correlated sampling by shared darts">
<rect x="70" y="50" width="84" height="150" rx="0" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
<rect x="70" y="125" width="40" height="75" fill="#2e6da4" opacity="0.55"/>
<rect x="114" y="155" width="40" height="45" fill="#c0392b" opacity="0.55"/>
<text x="112" y="216" font-size="11" text-anchor="middle" fill="#333">z = 1</text>
<text x="90" y="119.0" font-size="10.5" text-anchor="middle" fill="#2e6da4">P=0.5</text>
<text x="134" y="149.0" font-size="10.5" text-anchor="middle" fill="#c0392b">Q=0.3</text>
<rect x="180" y="50" width="84" height="150" rx="0" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
<rect x="180" y="155" width="40" height="45" fill="#2e6da4" opacity="0.55"/>
<rect x="224" y="155" width="40" height="45" fill="#c0392b" opacity="0.55"/>
<text x="222" y="216" font-size="11" text-anchor="middle" fill="#333">z = 2</text>
<text x="200" y="149.0" font-size="10.5" text-anchor="middle" fill="#2e6da4">P=0.3</text>
<text x="244" y="149.0" font-size="10.5" text-anchor="middle" fill="#c0392b">Q=0.3</text>
<rect x="290" y="50" width="84" height="150" rx="0" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
