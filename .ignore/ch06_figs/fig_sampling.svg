<text x="310" y="164.0" font-size="10.5" text-anchor="middle" fill="#2e6da4">P=0.2</text>
<text x="354" y="134.0" font-size="10.5" text-anchor="middle" fill="#c0392b">Q=0.4</text>
<circle cx="112" cy="137" r="6" fill="#2a7d2a"><animate attributeName="cx" values="112;332;112;222;332;112" keyTimes="0.000;0.200;0.400;0.600;0.800;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="cy" values="137;149;162;173;146;137" keyTimes="0.000;0.200;0.400;0.600;0.800;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="fill" values="#b06a00;#b06a00;#2a7d2a;#2a7d2a;#b06a00;#b06a00" keyTimes="0.000;0.200;0.400;0.600;0.800;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></circle>
<text x="270" y="26" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">shared darts (z, u): accept when u falls under your own curve</text>
<text x="270" y="232" font-size="11" text-anchor="middle" fill="#333">green dart: accepted by BOTH → same output · orange: accepted by one only → possible disagreement</text>
<text x="270" y="252" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">P(outputs differ) = 2d<tspan baseline-shift="sub" font-size="70%">TV</tspan>/(1 + d<tspan baseline-shift="sub" font-size="70%">TV</tspan>) ≤ 2d<tspan baseline-shift="sub" font-size="70%">TV</tspan>(P, Q)</text>
</svg>