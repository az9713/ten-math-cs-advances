<svg class="setupfig" viewBox="0 0 540 252" width="100%" role="img" aria-label="the cross strategy that defeats naive repetition">
<text x="270" y="22" font-size="13.5" text-anchor="middle" fill="#333" font-weight="bold">Feige's counterexample game G<tspan baseline-shift="sub" font-size="70%">F</tspan></text>
<text x="270" y="40" font-size="11.5" text-anchor="middle" fill="#333">x, y independent fair bits; answers are claims (player 1 got d) or (player 2 got d)</text>
<text x="270" y="55" font-size="11.5" text-anchor="middle" fill="#333">win iff both players make the same true claim</text>
<rect x="50" y="62" width="190" height="96" rx="6" fill="#f7f7f7" stroke="#aaa" stroke-width="1"/>
<text x="145" y="82" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">coordinate 1</text>
<text x="145" y="106" font-size="12.5" text-anchor="middle" fill="#2e6da4">a₁ = (1, x₁)</text>
<text x="145" y="128" font-size="12.5" text-anchor="middle" fill="#c0392b">b₁ = (1, y₂)</text>
<text x="145" y="150" font-size="11.5" text-anchor="middle" fill="#555">agree ⇔ y₂ = x₁</text>
<rect x="300" y="62" width="190" height="96" rx="6" fill="#f7f7f7" stroke="#aaa" stroke-width="1"/>
<text x="395" y="82" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">coordinate 2</text>
<text x="395" y="106" font-size="12.5" text-anchor="middle" fill="#2e6da4">a₂ = (2, x₁)</text>
<text x="395" y="128" font-size="12.5" text-anchor="middle" fill="#c0392b">b₂ = (2, y₂)</text>
<text x="395" y="150" font-size="11.5" text-anchor="middle" fill="#555">agree ⇔ x₁ = y₂</text>
<path d="M 148,166 C 210,190 330,190 392,166" fill="none" stroke="#7d3c98" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="270" y="196" font-size="12" text-anchor="middle" fill="#7d3c98">one shared event x₁ = y₂ makes BOTH coordinates win at once</text>
<rect x="90" y="210" width="360" height="30" rx="5" fill="#fdf7e3" stroke="#c9b45a" stroke-width="1"/>
<text x="270" y="230" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">ω(G<tspan baseline-shift="sub" font-size="70%">F</tspan> ⊗ G<tspan baseline-shift="sub" font-size="70%">F</tspan>) = 1/2 = ω(G<tspan baseline-shift="sub" font-size="70%">F</tspan>)  —  not 1/4</text>
</svg>