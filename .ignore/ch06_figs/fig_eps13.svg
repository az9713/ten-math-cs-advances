<svg class="setupfig" viewBox="0 0 520 230" width="100%" role="img" aria-label="anatomy of the epsilon exponent">
<defs><marker id="c6eA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="260" y="24" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">where ε¹³ comes from</text>
<rect x="60" y="30" width="400" height="40" rx="5" fill="#f7f7f7" stroke="#999" stroke-width="1.1"/>
<text x="260" y="46" font-size="11.8" text-anchor="middle" fill="#333">rounding must beat ε/4:</text>
<text x="260" y="62" font-size="11.8" text-anchor="middle" fill="#333">Bη<tspan baseline-shift="super" font-size="70%">1/12</tspan> ≤ ε/4 needs η ≲ ε¹²</text>
<line x1="260" y1="70" x2="260" y2="86" stroke="#333" stroke-width="1.4" marker-end="url(#c6eA)"/>
<rect x="60" y="72" width="400" height="40" rx="5" fill="#f7f7f7" stroke="#999" stroke-width="1.1"/>
<text x="260" y="88" font-size="11.8" text-anchor="middle" fill="#333">the 12th power is the embezzlement</text>
<text x="260" y="104" font-size="11.8" text-anchor="middle" fill="#333">exponent 1/12 of Import 1 (DSV15)</text>
<line x1="260" y1="112" x2="260" y2="128" stroke="#333" stroke-width="1.4" marker-end="url(#c6eA)"/>
<rect x="60" y="114" width="400" height="40" rx="5" fill="#f7f7f7" stroke="#999" stroke-width="1.1"/>
<text x="260" y="130" font-size="11.8" text-anchor="middle" fill="#333">η ≈ γ(1 + ℓ/ε)·const: one more ε</text>
<text x="260" y="146" font-size="11.8" text-anchor="middle" fill="#333">and the alphabet term ε + ℓ</text>
<line x1="260" y1="154" x2="260" y2="170" stroke="#333" stroke-width="1.4" marker-end="url(#c6eA)"/>
<rect x="60" y="156" width="400" height="28" rx="5" fill="#f7f7f7" stroke="#999" stroke-width="1.1"/>
<text x="260" y="172" font-size="11.8" text-anchor="middle" fill="#333">γ ∝ ε¹² · ε/(ε + ℓ) = ε¹³/(ε + ℓ)</text>
<text x="260" y="216" font-size="11.5" text-anchor="middle" fill="#555">the exponent 13 is an artifact of the tools, not conjectured optimal</text>
</svg>