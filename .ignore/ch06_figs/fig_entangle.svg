<svg class="setupfig" viewBox="0 0 520 210" width="100%" role="img" aria-label="product versus entangled correlations">
<text x="136" y="34" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">independent coins</text>
<text x="136" y="50" font-size="11" text-anchor="middle" fill="#555">P(a,b) = P(a)P(b): no correlation</text>
<rect x="56" y="60" width="78" height="42" rx="3" fill="rgb(186,220,255)" stroke="#999" stroke-width="1"/>
<text x="95" y="86" font-size="13" text-anchor="middle" fill="#333">0.25</text>
<rect x="136" y="60" width="78" height="42" rx="3" fill="rgb(186,220,255)" stroke="#999" stroke-width="1"/>
<text x="175" y="86" font-size="13" text-anchor="middle" fill="#333">0.25</text>
<rect x="56" y="104" width="78" height="42" rx="3" fill="rgb(186,220,255)" stroke="#999" stroke-width="1"/>
<text x="95" y="130" font-size="13" text-anchor="middle" fill="#333">0.25</text>
<rect x="136" y="104" width="78" height="42" rx="3" fill="rgb(186,220,255)" stroke="#999" stroke-width="1"/>
<text x="175" y="130" font-size="13" text-anchor="middle" fill="#333">0.25</text>
<text x="48" y="86" font-size="11" text-anchor="end" fill="#555">a=0</text>
<text x="48" y="130" font-size="11" text-anchor="end" fill="#555">a=1</text>
<text x="95" y="160" font-size="11" text-anchor="middle" fill="#555">b=0</text>
<text x="175" y="160" font-size="11" text-anchor="middle" fill="#555">b=1</text>
<text x="400" y="34" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">Φ⁺, both measure angle θ</text>
<text x="400" y="50" font-size="11" text-anchor="middle" fill="#555">outcomes always equal — for every θ</text>
<rect x="320" y="60" width="78" height="42" rx="3" fill="rgb(135,195,255)" stroke="#999" stroke-width="1"/>
<text x="359" y="86" font-size="13" text-anchor="middle" fill="#333">0.5</text>
<rect x="400" y="60" width="78" height="42" rx="3" fill="rgb(237,246,255)" stroke="#999" stroke-width="1"/>
<text x="439" y="86" font-size="13" text-anchor="middle" fill="#333">0</text>
<rect x="320" y="104" width="78" height="42" rx="3" fill="rgb(237,246,255)" stroke="#999" stroke-width="1"/>
<text x="359" y="130" font-size="13" text-anchor="middle" fill="#333">0</text>
<rect x="400" y="104" width="78" height="42" rx="3" fill="rgb(135,195,255)" stroke="#999" stroke-width="1"/>
<text x="439" y="130" font-size="13" text-anchor="middle" fill="#333">0.5</text>
<text x="312" y="86" font-size="11" text-anchor="end" fill="#555">a=0</text>
<text x="312" y="130" font-size="11" text-anchor="end" fill="#555">a=1</text>
<text x="359" y="160" font-size="11" text-anchor="middle" fill="#555">b=0</text>
<text x="439" y="160" font-size="11" text-anchor="middle" fill="#555">b=1</text>
<text x="260" y="196" font-size="11.5" text-anchor="middle" fill="#333">entanglement is stronger-than-shared-coin correlation: same-basis outcomes agree with probability 1</text>
</svg>