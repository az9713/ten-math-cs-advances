<svg class="setupfig" viewBox="0 0 500 250" width="100%" role="img" aria-label="one ideal posterior, two locally samplable copies">
<defs><marker id="c6dA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<ellipse cx="250" cy="66" rx="104" ry="34" fill="#f3ecf7" stroke="#7d3c98" stroke-width="1.5"/>
<text x="250" y="62" font-size="12.5" text-anchor="middle" fill="#7d3c98">posterior Q = P( · | W<tspan baseline-shift="sub" font-size="70%">D</tspan> )</text>
<text x="250" y="80" font-size="10.5" text-anchor="middle" fill="#555">nobody can sample it alone</text>
<ellipse cx="96" cy="180" rx="86" ry="32" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.5"/>
<text x="96" y="176" font-size="12" text-anchor="middle" fill="#2e6da4">J<tspan baseline-shift="sub" font-size="70%">A</tspan>: Alice samples</text>
<text x="96" y="193" font-size="11" text-anchor="middle" fill="#2e6da4">r from Q(R | i, Xᵢ = x)</text>
<ellipse cx="404" cy="180" rx="86" ry="32" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/>
<text x="404" y="176" font-size="12" text-anchor="middle" fill="#c0392b">J<tspan baseline-shift="sub" font-size="70%">B</tspan>: Bob samples</text>
<text x="404" y="193" font-size="11" text-anchor="middle" fill="#c0392b">r from Q(R | i, Yᵢ = y)</text>
<line x1="180" y1="108" x2="128" y2="148" stroke="#333" stroke-width="1.3" marker-end="url(#c6dA)"/>
<line x1="320" y1="108" x2="372" y2="148" stroke="#333" stroke-width="1.3" marker-end="url(#c6dA)"/>
<text x="122" y="122" font-size="12" text-anchor="middle" fill="#333">d<tspan baseline-shift="sub" font-size="70%">TV</tspan> ≤ κ</text>
<text x="382" y="122" font-size="12" text-anchor="middle" fill="#333">d<tspan baseline-shift="sub" font-size="70%">TV</tspan> ≤ κ</text>
<text x="250" y="235" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">correlated sampling couples them: P(r<tspan baseline-shift="sub" font-size="70%">A</tspan> ≠ r<tspan baseline-shift="sub" font-size="70%">B</tspan>) ≤ 4κ,   κ = √(3η/2)</text>
</svg>