<svg class="setupfig" viewBox="0 0 540 184" width="100%" role="img" aria-label="why the unrevealed questions factorize">
<rect x="30" y="34" width="220" height="40" rx="6" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.4"/>
<text x="140" y="52" font-size="11.5" text-anchor="middle" fill="#2e6da4">still-random Alice questions</text>
<text x="140" y="66" font-size="11" text-anchor="middle" fill="#2e6da4">live only on [n] ∖ (C<tspan baseline-shift="sub" font-size="70%">X</tspan> ∪ {i})</text>
<rect x="290" y="34" width="220" height="40" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.4"/>
<text x="400" y="52" font-size="11.5" text-anchor="middle" fill="#c0392b">still-random Bob questions</text>
<text x="400" y="66" font-size="11" text-anchor="middle" fill="#c0392b">live only on [n] ∖ (C<tspan baseline-shift="sub" font-size="70%">Y</tspan> ∪ {i})</text>
<text x="270" y="100" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">C<tspan baseline-shift="sub" font-size="70%">X</tspan> ∪ C<tspan baseline-shift="sub" font-size="70%">Y</tspan> = [n] ∖ {i} ⇒ these two index sets are DISJOINT</text>
<text x="270" y="126" font-size="12" text-anchor="middle" fill="#333">so, given (T, Xᵢ, Yᵢ), no jointly sampled pair (Xⱼ, Yⱼ) remains:</text>
<rect x="60" y="138" width="420" height="32" rx="5" fill="#fdf7e3" stroke="#c9b45a" stroke-width="1.4"/>
<text x="270" y="159" font-size="12.5" text-anchor="middle" fill="#333">P(xⁿ, yⁿ | t, x, y) = P(xⁿ | t, x) · P(yⁿ | t, y)   under the prior P</text>
</svg>