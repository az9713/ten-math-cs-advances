<line x1="395" y1="118" x2="285" y2="60" stroke="#c0392b" stroke-width="1.4" marker-end="url(#c6gR)"/>
<text x="324" y="106" font-size="11.5" text-anchor="end" fill="#c0392b">answer b</text>
<path d="M162,148 C 220,132 300,164 358,148" fill="none" stroke="#7d3c98" stroke-width="2.2" stroke-dasharray="1 5" stroke-linecap="round"/>
<text x="260" y="136" font-size="11.5" text-anchor="middle" fill="#7d3c98">shared entangled state ψ</text>
<text x="260" y="197" font-size="12" text-anchor="middle" fill="#333">win iff V(x, y, a, b) = 1 — no communication after the questions</text>
</svg>