<svg class="setupfig" viewBox="0 0 520 210" width="100%" role="img" aria-label="two-player one-round entangled game">
<defs><marker id="c6gA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="c6gR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="200" y="12" width="120" height="44" rx="7" fill="#f3f1ec" stroke="#333" stroke-width="1.4"/>
<text x="260" y="30" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">referee</text>
<text x="260" y="47" font-size="11" text-anchor="middle" fill="#555">samples (x, y) ~ μ</text>
<rect x="30" y="120" width="130" height="56" rx="7" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.4"/>
<text x="95" y="141" font-size="13" text-anchor="middle" fill="#2e6da4" font-weight="bold">Alice</text>
<text x="95" y="158" font-size="11" text-anchor="middle" fill="#555">measures with x</text>
<rect x="360" y="120" width="130" height="56" rx="7" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.4"/>
<text x="425" y="141" font-size="13" text-anchor="middle" fill="#2e6da4" font-weight="bold">Bob</text>
<text x="425" y="158" font-size="11" text-anchor="middle" fill="#555">measures with y</text>
<line x1="215" y1="56" x2="75" y2="118" stroke="#333" stroke-width="1.4" marker-end="url(#c6gA)"/>
<text x="112" y="76" font-size="11.5" text-anchor="middle" fill="#333">question x</text>
<line x1="305" y1="56" x2="445" y2="118" stroke="#333" stroke-width="1.4" marker-end="url(#c6gA)"/>
<text x="408" y="76" font-size="11.5" text-anchor="middle" fill="#333">question y</text>
<line x1="125" y1="118" x2="235" y2="60" stroke="#c0392b" stroke-width="1.4" marker-end="url(#c6gR)"/>
