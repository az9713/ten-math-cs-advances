<svg class="setupfig" viewBox="0 0 540 196" width="100%" role="img" aria-label="why quantum conditioning is the hard part">
<text x="135" y="24" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">classical player</text>
<text x="405" y="24" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">entangled player</text>
<rect x="28" y="36" width="214" height="118" rx="6" fill="#f2f7f2" stroke="#2a7d2a" stroke-width="1.4"/>
<rect x="298" y="36" width="214" height="118" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.4"/>
<text x="135" y="56" font-size="11" text-anchor="middle" fill="#333">strategy = a function; its</text>
<text x="135" y="72" font-size="11" text-anchor="middle" fill="#333">randomness can be resampled</text>
<text x="135" y="88" font-size="11" text-anchor="middle" fill="#333">consistently with any</text>
<text x="135" y="104" font-size="11" text-anchor="middle" fill="#333">conditioning — Holenstein</text>
<text x="135" y="120" font-size="11" text-anchor="middle" fill="#333">embeds a fresh question</text>
<text x="135" y="136" font-size="11" text-anchor="middle" fill="#333">into a conditioned transcript</text>
<text x="405" y="56" font-size="11" text-anchor="middle" fill="#333">strategy = measurements on</text>
<text x="405" y="72" font-size="11" text-anchor="middle" fill="#333">a state; conditioning on</text>
<text x="405" y="88" font-size="11" text-anchor="middle" fill="#333">a rare win POSTSELECTS the</text>
<text x="405" y="104" font-size="11" text-anchor="middle" fill="#333">state — measuring destroyed</text>
<text x="405" y="120" font-size="11" text-anchor="middle" fill="#333">it, and a naive redo pays a</text>
<text x="405" y="136" font-size="11" text-anchor="middle" fill="#333">factor 1/p ≈ eᵞⁿ</text>
<text x="270" y="180" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">the new lemma makes quantum conditioning survivable: its estimates never divide by p</text>
</svg>