<figcaption>The shared-machinery map. Boxes with a dark-red border are primer homes; solid arrows are primers reused forward (read the source section first, or accept it as a black box); the dashed arrow is the one backward flow of a <i>result</i>: chapter 2’s s → 1 limit independently recovers chapter 1’s packing exponent. The bottom row imports nothing.</figcaption>
